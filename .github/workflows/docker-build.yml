name: Build, Verify, and Release

# Source-based Compose installs do not require Docker Hub. Releases are immutable.
env:
  VERSION: "1.4.13"

on:
  workflow_dispatch:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

permissions:
  contents: read

# Prevent two main-branch runs from racing to create the same semantic tag.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release decision
    runs-on: ubuntu-latest
    env:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
    outputs:
      version: ${{ env.VERSION }}
      publish_release: ${{ steps.release.outputs.publish_release }}
      publish_images: ${{ steps.release.outputs.publish_images }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: release
        name: Decide whether this push creates a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "publish_images=false" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" != "refs/heads/main" || ( "${GITHUB_EVENT_NAME}" != "push" && "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ) ]]; then
            echo "publish_release=false" >> "$GITHUB_OUTPUT"
            echo "Verification-only run: ${GITHUB_EVENT_NAME} on ${GITHUB_REF}"
            exit 0
          fi

          # A failed draft can be completed on retry. Published assets cannot
          # be replaced, and an existing tag must refer to exactly this source.
          published="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [[ "$published" == "false" ]]; then
            echo "publish_release=false" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is already published. Bump VERSION for the next release."
            exit 0
          fi
          if [[ "$published" == "true" ]]; then
            draft_source="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')"
            [[ "$draft_source" == "$GITHUB_SHA" ]] || {
              echo 'Existing draft belongs to different source; bump VERSION or resolve the draft.' >&2; exit 1;
            }
          fi
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            [[ "$(git rev-parse "refs/tags/${VERSION}^{commit}")" == "$GITHUB_SHA" ]] || {
              echo 'Existing tag points at different source; bump VERSION.' >&2; exit 1;
            }
          fi
          echo "publish_release=true" >> "$GITHUB_OUTPUT"
          if [[ -n "${DOCKER_HUB_USERNAME}" && -n "${DOCKER_HUB_TOKEN}" ]]; then
            echo "publish_images=true" >> "$GITHUB_OUTPUT"
          fi
          echo "The source tag, scripts and Agent assets will be published after all checks pass."

  build-gost:
    name: Build GOST binary
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.4"
          cache-dependency-path: |
            go-gost/go.sum
            go-gost/x/go.sum

      - name: Verify one-click Agent binaries match source
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          source_revision="$(git log -1 --format=%H -- go-gost)"
          for arch in amd64 arm64; do
            binary="artifacts/flux-panel-agent-linux-${arch}"
            embedded_revision="$(go version -m "$binary" | awk '$1 == "build" && $2 ~ /^vcs.revision=/ { sub(/^vcs.revision=/, "", $2); print $2 }')"
            if [[ "$embedded_revision" != "$source_revision" ]]; then
              echo "${binary} was built from ${embedded_revision}, expected ${source_revision}" >&2
              exit 1
            fi
            (cd artifacts && sha256sum -c "flux-panel-agent-linux-${arch}.sha256")
          done

      - name: Install UPX
        run: |
          wget -q https://github.com/upx/upx/releases/download/v4.2.1/upx-4.2.1-amd64_linux.tar.xz
          tar -xf upx-4.2.1-amd64_linux.tar.xz
          sudo install -m 0755 upx-4.2.1-amd64_linux/upx /usr/local/bin/upx

      - name: Test Agent main module
        working-directory: ./go-gost
        run: go test ./...

      - name: Test Agent modules
        working-directory: ./go-gost/x
        run: go test ./...

      - name: Check Agent forwarding and resource races
        working-directory: ./go-gost/x
        run: go test -race -count=5 -timeout=180s ./chain ./internal/net/udp ./internal/net/proxyproto ./internal/util/mux ./handler/forward/local ./dialer ./service ./socket ./api

      - name: Record optional mux diagnostics cost
        working-directory: ./go-gost/x
        shell: bash
        run: go test -run '^$' -bench BenchmarkMuxTransfer -benchtime=1s -count=5 -benchmem ./internal/util/mux | tee "$RUNNER_TEMP/mux-diagnostics-benchmark.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: mux-diagnostics-benchmark
          path: ${{ runner.temp }}/mux-diagnostics-benchmark.txt

      - name: Build GOST binary (AMD64)
        working-directory: ./go-gost
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o flux-panel-agent-linux-amd64

      - name: Build GOST binary (ARM64)
        working-directory: ./go-gost
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o flux-panel-agent-linux-arm64

      - name: Compress binaries with UPX
        working-directory: ./go-gost
        run: |
          upx --best --lzma flux-panel-agent-linux-amd64
          upx --best --lzma flux-panel-agent-linux-arm64
          sha256sum flux-panel-agent-linux-amd64 > flux-panel-agent-linux-amd64.sha256
          sha256sum flux-panel-agent-linux-arm64 > flux-panel-agent-linux-arm64.sha256

      - name: Upload GOST artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gost-binaries
          path: |
            go-gost/flux-panel-agent-linux-amd64
            go-gost/flux-panel-agent-linux-amd64.sha256
            go-gost/flux-panel-agent-linux-arm64
            go-gost/flux-panel-agent-linux-arm64.sha256
          if-no-files-found: error

  package-agent-installer:
    name: Refresh installer binaries for owned pull requests
    needs: build-gost
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.4"
          cache-dependency-path: |
            go-gost/go.sum
            go-gost/x/go.sum
      - name: Build and verify immutable-source installer binaries
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          # Never replace a contributor's newer work with an older build.
          actual_head="$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | awk '{print $1}')"
          if [[ "$actual_head" != "$EXPECTED_HEAD" ]]; then
            echo 'The branch changed during verification; leaving its artifacts untouched.'
            exit 0
          fi
          source_revision="$(git log -1 --format=%H -- go-gost)"
          artifacts_current=true
          for arch in amd64 arm64; do
            binary="artifacts/flux-panel-agent-linux-${arch}"
            embedded_revision="$(go version -m "$binary" | awk '$1 == "build" && $2 ~ /^vcs.revision=/ { sub(/^vcs.revision=/, "", $2); print $2 }')"
            if [[ "$embedded_revision" != "$source_revision" ]] || ! (cd artifacts && sha256sum -c "flux-panel-agent-linux-${arch}.sha256"); then
              artifacts_current=false
            fi
          done
          if [[ "$artifacts_current" == true ]]; then
            echo 'Installer artifacts already match the Agent source and checksums.'
            exit 0
          fi
          build_dir="$(mktemp -d "${RUNNER_TEMP}/lunaris-agent-build.XXXXXX")"
          # Documentation/artifact-only commits may follow the last Go change.
          # Build that actual source commit, rather than embedding a later HEAD.
          # Go 1.23 does not embed VCS info for a linked worktree (.git is a
          # file), so use this isolated runner's original checkout instead.
          git checkout --detach "$source_revision"
          # Keep outputs outside the source checkout for clean VCS metadata.
          # Installer assets stay unpacked to preserve Go build info.
          for arch in amd64 arm64; do
            (cd go-gost && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -mod=readonly -ldflags="-s -w" -o "$build_dir/flux-panel-agent-linux-$arch")
            binary="$build_dir/flux-panel-agent-linux-$arch"
            embedded_revision="$(go version -m "$binary" | awk '$1 == "build" && $2 ~ /^vcs.revision=/ { sub(/^vcs.revision=/, "", $2); print $2 }')"
            [[ "$embedded_revision" == "$source_revision" ]] || { echo 'Agent build revision mismatch' >&2; exit 1; }
            go version -m "$binary" | grep -q 'vcs.modified=false' || { echo 'Agent source checkout is dirty' >&2; exit 1; }
          done
          git checkout --detach "$EXPECTED_HEAD"
          actual_head="$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | awk '{print $1}')"
          if [[ "$actual_head" != "$EXPECTED_HEAD" ]]; then
            echo 'The branch changed during the build; leaving its artifacts untouched.'
            exit 0
          fi
          for arch in amd64 arm64; do
            install -m 0755 "$build_dir/flux-panel-agent-linux-$arch" "artifacts/flux-panel-agent-linux-$arch"
            (cd artifacts && sha256sum "flux-panel-agent-linux-$arch" > "flux-panel-agent-linux-$arch.sha256")
          done
          git add artifacts/flux-panel-agent-linux-amd64 artifacts/flux-panel-agent-linux-amd64.sha256 artifacts/flux-panel-agent-linux-arm64 artifacts/flux-panel-agent-linux-arm64.sha256
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Build installer Agents from ${source_revision}"
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"

  benchmark-agent-resources:
    name: Compare native UDP throughput
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.4"
          cache-dependency-path: go-gost/x/go.sum
      - name: Compare original and proposed UDP listeners
        env:
          BASELINE_REF: ${{ github.event.pull_request.base.sha }}
        run: python3 tests/agent_resource_benchmark.py --baseline-ref "$BASELINE_REF" --output "$RUNNER_TEMP/agent-resource-benchmark.json"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-resource-benchmark
          path: ${{ runner.temp }}/agent-resource-benchmark.json
          if-no-files-found: error

  build-vite:
    name: Build Vite frontend
    needs: prepare
    runs-on: ubuntu-latest
    env:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vite-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./vite-frontend
        # This lockfile needs npm's current resolver for its nested legacy dependencies.
        run: npm install --no-audit --no-fund

      - name: Test frontend behavior
        working-directory: ./vite-frontend
        run: npm test

      - name: Build frontend
        working-directory: ./vite-frontend
        run: npm run build

      - name: Verify frontend container and Nginx configuration
        run: |
          docker build -t lunaris-frontend-check ./vite-frontend
          docker run --rm --add-host backend:127.0.0.1 lunaris-frontend-check nginx -t

      - name: Set up Docker Buildx
        if: needs.prepare.outputs.publish_images == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: needs.prepare.outputs.publish_images == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Build and push frontend images
        if: needs.prepare.outputs.publish_images == 'true'
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t "${DOCKER_HUB_USERNAME}/vite-frontend:latest" \
            -t "${DOCKER_HUB_USERNAME}/vite-frontend:${VERSION}" \
            ./vite-frontend

  build-java:
    name: Build Spring Boot backend
    needs: prepare
    runs-on: ubuntu-latest
    env:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build Java JAR
        working-directory: ./springboot-backend
        run: mvn -B clean package

      - name: Verify updater and installer regressions
        run: |
          python3 -m unittest discover -s updater -p 'test_*.py'
          python3 tests/release_decision_test.py
          python3 tests/backend_installer_contract_test.py
          python3 tests/release_version_contract_test.py
          python3 tests/realtime_node_access_test.py
          bash tests/install_tuning_test.sh

      - name: Verify backend container build
        run: docker build -t lunaris-backend-check ./springboot-backend

      - name: Verify legacy MySQL upgrade and current MySQL bootstrap
        run: |
          MYSQL_TEST_IMAGE=mysql:5.7 bash tests/backend_mysql_test.sh
          MYSQL_TEST_IMAGE=mysql:8.4 bash tests/backend_mysql_test.sh

      - name: Set up Docker Buildx
        if: needs.prepare.outputs.publish_images == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: needs.prepare.outputs.publish_images == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Build and push backend images
        if: needs.prepare.outputs.publish_images == 'true'
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t "${DOCKER_HUB_USERNAME}/springboot-backend:latest" \
            -t "${DOCKER_HUB_USERNAME}/springboot-backend:${VERSION}" \
            ./springboot-backend

  create-release:
    name: Create immutable release
    needs: [prepare, build-gost, build-vite, build-java]
    if: needs.prepare.outputs.publish_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download GOST binaries
        uses: actions/download-artifact@v4
        with:
          name: gost-binaries
          path: ./artifacts

      - name: Package checked installer scripts
        shell: bash
        run: |
          for script in backend_install.sh install.sh panel_install.sh upgrade_from_original.sh; do
            cp "./${script}" "./artifacts/${script}"
            sha256sum "./artifacts/${script}" > "./artifacts/${script}.sha256"
          done
          cp updater/env_migration.py artifacts/env_migration.py
          sha256sum artifacts/env_migration.py > artifacts/env_migration.py.sha256

      - name: Create or resume release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${VERSION}" --draft --target "${GITHUB_SHA}" \
            --title "Release ${VERSION}" \
            --generate-notes \
            --repo "${GITHUB_REPOSITORY}"
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" == "true" ]] || {
            echo 'Refusing to overwrite assets of a published release.' >&2; exit 1;
          }
          gh release upload "${VERSION}" \
            --clobber \
            ./artifacts/flux-panel-agent-linux-amd64 \
            ./artifacts/flux-panel-agent-linux-amd64.sha256 \
            ./artifacts/flux-panel-agent-linux-arm64 \
            ./artifacts/flux-panel-agent-linux-arm64.sha256 \
            ./artifacts/backend_install.sh \
            ./artifacts/backend_install.sh.sha256 \
            ./artifacts/install.sh \
            ./artifacts/install.sh.sha256 \
            ./artifacts/panel_install.sh \
            ./artifacts/panel_install.sh.sha256 \
            ./artifacts/upgrade_from_original.sh \
            ./artifacts/upgrade_from_original.sh.sha256 \
            ./artifacts/env_migration.py \
            ./artifacts/env_migration.py.sha256 \
            ./docker-compose-v4.yml \
            ./docker-compose-v6.yml \
            ./gost.sql \
            --repo "${GITHUB_REPOSITORY}"

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${VERSION}" --draft=false --repo "${GITHUB_REPOSITORY}"
