spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?useUnicode=true&useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Keep pool sizing explicit, but do not compensate for slow work by
      # multiplying HTTP threads. Node commands run on bounded executors.
      max-lifetime: 1800000
      connection-timeout: 30000
      idle-timeout: 300000
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: HikariCP
      auto-commit: true
      connection-test-query: SELECT 1
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 6365
  # Honor the public scheme supplied by a trusted TLS reverse proxy so
  # WebSocket same-origin checks compare HTTPS with HTTPS.
  forward-headers-strategy: framework
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 200
    max-connections: 2000
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
    include-message: always
    include-binding-errors: always

mybatis-plus:
  mapper-locations: classpath*:/mapper/**Mapper.xml
#  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt-secret: ${JWT_SECRET}
log-dir: ${LOG_DIR}

panel-updater:
  url: ${PANEL_UPDATER_URL:http://updater:18080}
  token: ${PANEL_UPDATER_TOKEN:}

vps:
  security:
    # User-submitted VPSes are always public-only. This opt-in only permits
    # administrator inventory to use RFC1918 / ULA addresses.
    allow-private-admin-targets: ${VPS_ALLOW_PRIVATE_ADMIN_TARGETS:false}
  terminal:
    # Comma-separated browser origins. Empty keeps the panel's same-origin default.
    allowed-origins: ${VPS_TERMINAL_ALLOWED_ORIGINS:}


captcha:
  init-default-resource: true
  secondary:
    enabled: true
    expire: 120000
