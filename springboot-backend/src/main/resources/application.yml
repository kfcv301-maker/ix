spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?useUnicode=true&useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Keep pool sizing explicit, but do not compensate for slow work by
      # multiplying HTTP threads. Node commands run on bounded executors.
      max-lifetime: 1800000
      connection-timeout: 30000
      idle-timeout: 300000
      # A control panel has short database requests. Keeping a large idle
      # pool wastes MySQL and JVM memory without improving normal traffic.
      maximum-pool-size: 12
      minimum-idle: 2
      pool-name: HikariCP
      auto-commit: true
      connection-test-query: SELECT 1
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 6365
  # Honor the public scheme supplied by a trusted TLS reverse proxy so
  # WebSocket same-origin checks compare HTTPS with HTTPS.
  forward-headers-strategy: framework
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 100
    max-connections: 1000
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-binding-errors: never

mybatis-plus:
  mapper-locations: classpath*:/mapper/**Mapper.xml
#  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt-secret: ${JWT_SECRET}
log-dir: ${LOG_DIR:logs}

panel-updater:
  url: ${PANEL_UPDATER_URL:http://updater:18080}
  token: ${PANEL_UPDATER_TOKEN:}

panel:
  initial-admin:
    username: ${PANEL_INITIAL_ADMIN_USERNAME:}
    password: ${PANEL_INITIAL_ADMIN_PASSWORD:}

realtime:
  # Empty is same-origin; set a comma-separated list only for a separate UI origin.
  allowed-origins: ${REALTIME_ALLOWED_ORIGINS:}

cors:
  # Empty means no cross-origin API reads. Configure explicit UI origins only when needed.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

agent:
  install:
    release: ${AGENT_INSTALL_RELEASE:1.4.5}

vps:
  credential-key: ${VPS_CREDENTIAL_KEY:}
  backend-install:
    # The stable installer URL remains unchanged; this pins the backend source
    # version it installs on the VPS.
    release: ${VPS_BACKEND_INSTALL_RELEASE:1.4.5}
  security:
    # User-submitted VPSes are always public-only. This opt-in only permits
    # administrator inventory to use RFC1918 / ULA addresses.
    allow-private-admin-targets: ${VPS_ALLOW_PRIVATE_ADMIN_TARGETS:false}
  terminal:
    # Comma-separated browser origins. Empty keeps the panel's same-origin default.
    allowed-origins: ${VPS_TERMINAL_ALLOWED_ORIGINS:}


captcha:
  init-default-resource: true
  secondary:
    enabled: true
    expire: 120000
