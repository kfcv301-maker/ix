services:
  mysql:
    # Old updaters do not migrate .env. Missing variables must preserve 5.7;
    # new installers explicitly select 8.4 for a new data directory.
    image: ${MYSQL_IMAGE:-mysql:5.7}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=1000
      --innodb_buffer_pool_size=256M
    volumes:
      - mysql_data:/var/lib/mysql
      - ./gost.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [flux-panel]

  backend:
    build:
      context: ./springboot-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PANEL_UPDATER_TOKEN: ${PANEL_UPDATER_TOKEN}
      PANEL_INITIAL_ADMIN_USERNAME: ${PANEL_INITIAL_ADMIN_USERNAME:-}
      PANEL_INITIAL_ADMIN_PASSWORD: ${PANEL_INITIAL_ADMIN_PASSWORD:-}
      VPS_CREDENTIAL_KEY: ${VPS_CREDENTIAL_KEY:-}
      VPS_BACKEND_INSTALL_RELEASE: ${VPS_BACKEND_INSTALL_RELEASE:-1.4.5}
      AGENT_INSTALL_RELEASE: ${AGENT_INSTALL_RELEASE:-1.4.5}
      VPS_ALLOW_PRIVATE_ADMIN_TARGETS: ${VPS_ALLOW_PRIVATE_ADMIN_TARGETS:-false}
      VPS_TERMINAL_ALLOWED_ORIGINS: "${VPS_TERMINAL_ALLOWED_ORIGINS:-}"
      REALTIME_ALLOWED_ORIGINS: "${REALTIME_ALLOWED_ORIGINS:-}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      LOG_DIR: /app/logs
      # Override with JAVA_OPTS in .env for unusually large installations.
      JAVA_OPTS: "${JAVA_OPTS:--Xms128m -Xmx384m -XX:MaxMetaspaceSize=128m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai}"
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-6365}:6365"
    volumes:
      - backend_logs:/app/logs
      - backend_config:/app/config
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6365/flow/test"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 18
    networks: [flux-panel]

  frontend:
    build:
      context: ./vite-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-6366}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [flux-panel]

  # Deliberately has no published port.  The backend can reach it only on the
  # Docker network and authenticates every request with PANEL_UPDATER_TOKEN.
  updater:
    # docker/compose only publishes the legacy Compose v1 image. Use the
    # official Docker CLI image and install the v2 Compose plugin at startup.
    image: docker:27-cli
    restart: unless-stopped
    environment:
      PANEL_UPDATER_TOKEN: ${PANEL_UPDATER_TOKEN}
      INSTALL_DIR: /workspace
      PROJECT_NAME: flux-panel-enhanced
      REPO_URL: https://github.com/kfcv301-maker/ix.git
      BRANCH: ${PANEL_RELEASE_REF:-1.4.5}
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh", "/workspace/updater/entrypoint.sh"]
    networks: [flux-panel]

volumes:
  # Keep names explicit.  A migration from the upstream panel can set
  # MYSQL_DATA_VOLUME=mysql_data to attach its existing data without copying it.
  mysql_data:
    name: ${MYSQL_DATA_VOLUME:-flux-panel-enhanced_mysql_data}
  backend_logs:
    name: ${BACKEND_LOG_VOLUME:-flux-panel-enhanced_backend_logs}
  backend_config:
    name: ${BACKEND_CONFIG_VOLUME:-flux-panel-enhanced_backend_config}

networks:
  flux-panel:
    driver: bridge
