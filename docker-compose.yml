services:
  mysql:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=1000
      --innodb_buffer_pool_size=256M
    volumes:
      - mysql_data:/var/lib/mysql
      - ./gost.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [flux-panel]

  backend:
    build:
      context: ./springboot-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PANEL_UPDATER_TOKEN: ${PANEL_UPDATER_TOKEN}
      LOG_DIR: /app/logs
      JAVA_OPTS: -Xms256m -Xmx512m -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
    ports:
      - "${BACKEND_PORT}:6365"
    volumes:
      - backend_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks: [flux-panel]

  frontend:
    build:
      context: ./vite-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT}:80"
    depends_on:
      - backend
    networks: [flux-panel]

  # Deliberately has no published port.  The backend can reach it only on the
  # Docker network and authenticates every request with PANEL_UPDATER_TOKEN.
  updater:
    image: docker/compose:2.27.0
    restart: unless-stopped
    environment:
      PANEL_UPDATER_TOKEN: ${PANEL_UPDATER_TOKEN}
      INSTALL_DIR: /workspace
      PROJECT_NAME: flux-panel-enhanced
      REPO_URL: https://github.com/kfcv301-maker/ix.git
      BRANCH: main
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh", "/workspace/updater/entrypoint.sh"]
    networks: [flux-panel]

volumes:
  # Keep names explicit.  A migration from the upstream panel can set
  # MYSQL_DATA_VOLUME=mysql_data to attach its existing data without copying it.
  mysql_data:
    name: ${MYSQL_DATA_VOLUME:-flux-panel-enhanced_mysql_data}
  backend_logs:
    name: ${BACKEND_LOG_VOLUME:-flux-panel-enhanced_backend_logs}

networks:
  flux-panel:
    driver: bridge
